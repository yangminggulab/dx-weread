.dashboard-diary-dialog { width:min(1100px,calc(100% - 48px)); max-height:90vh; padding:24px 28px; border:1px solid rgb(var(--color-line)); border-radius:14px; color:rgb(var(--color-ink)); background:rgb(var(--color-paper)); box-shadow:0 18px 70px rgb(var(--color-ink) / .2); }
.dashboard-diary-dialog::backdrop { background:rgb(var(--color-ink) / .3); }
.dashboard-card-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px; margin-bottom:12px; }
.dashboard-card-heading h2 { font-size:17px; font-weight:600; }
.dashboard-card-heading button { min-height:44px; min-width:44px; font-size:12px; color:rgb(var(--color-accent)); }
.dashboard-diary-dialog .diary-writing-paper { min-height:440px; }
.dashboard-diary-dialog .diary-writing-paper .diary-textarea { min-height:260px; }
@media (max-width:1100px) {
  .workspace-math-link { display:none; }
  .workspace-main, .workspace-toolbar { padding-left:24px; padding-right:24px; }
  .workbench, .workbench-main, .workbench-side { gap:18px; }
  .workbench-columns, .workbench-notes, .workbench-side > section { padding:18px; }
  .workbench-columns { gap:16px; }
  .workbench-book-column { padding-left:16px; }
  .workspace-section-heading { gap:6px; flex-wrap:wrap; }
  .workspace-section-heading h2 { font-size:17px; }
  .workbench-reading-totals { gap:16px; }
  .workbench-reading-totals strong { font-size:18px; }
  .dashboard-learning-book { gap:8px; }
  .weread-compact .weread-shelf-book { gap:8px; }
  .weread-shelf-title { flex-wrap:wrap; gap:2px 6px; }
  .dashboard-book > div:first-child > span { display:block; width:100%; }
}
@media (max-width:959px) {
  .workbench { grid-template-columns:minmax(0,1fr); }
  .workbench-main { display:contents; }
  .workbench-columns { order:0; }
  .workbench-side { order:1; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
  .reading-revisit { grid-column:1 / -1; }
  .workbench-notes { order:2; }
  .learning-book-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:767px) {
  .workspace-toolbar { padding:8px 16px; gap:8px; min-height:60px; }
  .workspace-button { padding:8px 10px; font-size:12px; }
  .workspace-main { padding:20px 16px 32px; }
  .workbench-columns, .workbench-side { grid-template-columns:minmax(0,1fr); }
  .workbench-book-column { padding:22px 0 0; border-left:0; border-top:1px solid rgb(var(--color-line-soft)); }
  .reading-revisit { grid-column:auto; }
  .diary-workspace { grid-template-columns:minmax(0,1fr); }
  .diary-history-desktop { display:none; }
  .diary-history-mobile { display:block; border-bottom:1px solid rgb(var(--color-line)); background:rgb(var(--color-surface)); }
  .diary-history-mobile summary { padding:15px 18px; font-size:13px; cursor:pointer; min-height:48px; }
  .diary-history-mobile .diary-history-list { max-height:220px; }
  .diary-writing-paper { padding:23px 20px 20px; min-height:500px; }
  .learning-book-grid { grid-template-columns:minmax(0,1fr); }
  .notes-workspace, .notes-workspace.is-full-page, .workbench-notes .notes-workspace.is-full-page { grid-template-columns:minmax(0,1fr); height:auto; }
  .notes-toolbar { flex-direction:column; align-items:stretch; gap:8px; }
  .notes-toolbar .workspace-search { width:100%; max-width:none; }
  .notes-list { max-height:230px; border-right:0; border-bottom:1px solid rgb(var(--color-line)); }
  .note-reading-pane, .workbench-notes .note-reading-pane { padding:23px 0; min-height:280px; overflow-y:visible; }
  .workspace-header-brand strong { font-size:11px; }
  .workspace-header-logo { display:none; }
  .workspace-header-actions { gap:10px; }
  .workspace-header-actions .secondary { display:none; }
}
@media (prefers-reduced-motion:reduce) {
  .anim-fade, .anim-up, .anim-right { animation:none; }
  .kcard, .workspace-button { transition:none; }
  .kcard:hover { transform:none; }
}

/* Reading uses violet; task actions retain blue. Reading activity uses violet intensity. */
.workbench-book-column, .workbench-notes, .reading-revisit { --color-accent:var(--color-reading); --color-accent-hover:var(--color-reading-hover); --color-accent-soft:var(--color-reading-soft); --color-accent-border:var(--color-reading-border); }
.workbench-task-column .dashboard-tasks { height:100%; }
.workbench-reading-totals > div:first-child strong { color:rgb(var(--color-accent)); }
.workbench-reading-totals > div:last-child strong { color:rgb(var(--color-reading)); }
.heatmap-note-marker { background:rgb(var(--color-reading)); }
.weread-compact { border-top:1px solid rgb(var(--color-line-soft)); margin-top:14px; padding-top:14px; }
</style>
